title: "oh-sunny의 기록"
description: "oh-sunny의 블로그"
url: "https://oh-sunny.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
permalink: /:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-sitemap
exclude:
  - README.md
  - tests
  - Gemfile
  - Gemfile.lock
  - scripts
  - post-template.md.txt
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
google_analytics: ""
