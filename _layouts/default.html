<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
{% if site.google_analytics != '' and site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | escape }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config',{{ site.google_analytics | jsonify }});</script>
{% endif %}
</head><body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="shell">
<header class="sidebar">
<a class="wordmark" href="{{ '/' | relative_url }}">oh-sunny<span class="dot">.</span></a>
<p class="site-note">배운 것과<br>오래 남은 생각들.</p>
<nav aria-label="메인 메뉴"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>모든 기록 <span>↗</span></a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>이 공간에 대해</a><a href="{{ '/feed.xml' | relative_url }}">RSS 구독</a></nav>
<p class="side-bottom">조금씩, 내 속도로.</p>
</header>
<main id="main">{{ content }}</main>
<footer><span>© {{ 'now' | date: '%Y' }} oh-sunny. All rights reserved.</span><a href="{{ '/privacy/' | relative_url }}">방문 통계 안내</a></footer>
</div></body></html>
